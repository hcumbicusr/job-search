services:
  # --- Base de Datos PostgreSQL ---
  db:
    image: postgres:15
    container_name: servir-postgres
    restart: always
    env_file:
      - .env-docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- Tu Aplicación Node.js ---
  app:
    container_name: servir-scraper
    build: .
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5000:5000"
    # Sincronizamos la hora con el host para que el Cron se ejecute a la hora correcta de Perú
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  
volumes:
  pgdata: